[package]
name = "mathblocks"
version = "0.1.0"
description = "MathBlocks — advanced mathematical equation editor for Microsoft Word"
edition = "2021"
rust-version = "1.77"

[lib]
name = "mathblocks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "io-util", "net", "macros", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
