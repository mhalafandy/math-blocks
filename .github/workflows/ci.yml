name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fonts for the palette support test (Liberation Serif = Times New Roman metrics)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm --filter @mathblocks/app build

  windows:
    name: Windows build (desktop app + Word connector)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: pnpm install --frozen-lockfile


      - name: Palette font audit with the real Times New Roman and Symbol
        run: pnpm tsx tools/palette-audit.ts
      - uses: actions/upload-artifact@v4
        with:
          name: palette-audit-windows
          path: |
            docs/palette-audit-windows.csv
            docs/PALETTE-AUDIT-windows.md

      - name: Set build version and updater signing
        shell: pwsh
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          # Every build gets a higher version (0.1.<run number>) so installed apps see it as an update.
          $version = "0.1.${{ github.run_number }}"
          $conf = Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf.bundle.createUpdaterArtifacts = ($env:HAS_KEY -eq 'true')
          $conf | ConvertTo-Json -Depth 20 | Set-Content app/src-tauri/tauri.conf.json -Encoding utf8
          "APP_VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          "SIGNED=$env:HAS_KEY" | Out-File $env:GITHUB_ENV -Append
          if ($env:HAS_KEY -ne 'true') { Write-Warning "TAURI_SIGNING_PRIVATE_KEY secret not set: building without auto-update files." }

      - name: Build Word connector (stamped with the build version)
        run: dotnet build connector-word/src -c Release -p:Version=${{ env.APP_VERSION }}

      - name: Build desktop app installer
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/connector | Out-Null
          Copy-Item connector-word/src/bin/Release/net48/MathBlocks.WordConnector.dll out/connector/
          Copy-Item connector-word/install/*.ps1 out/connector/
          Copy-Item app/src-tauri/target/release/bundle/nsis/*.exe out/

      - name: Package downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dl | Out-Null
          Copy-Item out/*.exe dl/
          if ($env:SIGNED -eq 'true') {
            $exe = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
            Copy-Item "$($exe.FullName).sig" dl/
            $manifest = [ordered]@{
              version  = $env:APP_VERSION
              notes    = "Build of commit ${{ github.sha }}"
              pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = @{
                "windows-x86_64" = @{
                  signature = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
                  url       = "https://github.com/${{ github.repository }}/releases/download/dev-build/$($exe.Name)"
                }
              }
            }
            $manifest | ConvertTo-Json -Depth 5 | Set-Content dl/latest.json -Encoding utf8
          }
          Compress-Archive -Path out/connector/* -DestinationPath dl/MathBlocks-Word-connector.zip
          Compress-Archive -Path fixtures/spike/*.docx -DestinationPath dl/MathBlocks-M1-test-documents.zip

      - name: Publish "Latest test build" release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-build --cleanup-tag --yes || true
          gh release create dev-build dl/* --prerelease --target "$GITHUB_SHA" \
            --title "Latest test build ($APP_VERSION)" \
            --notes "Automatic build $APP_VERSION of commit ${GITHUB_SHA::7}. Installed apps update themselves and keep the Word add-in installed. First install: docs/DEVELOPMENT.md section 0."

      - uses: actions/upload-artifact@v4
        with:
          name: MathBlocks-windows-${{ github.sha }}
          path: out/
          retention-days: 30
